<head>

<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">

<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-display:swap;src:url(fonts/barlow-700.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-800.woff2) format("woff2")}
html{-webkit-text-size-adjust:100%;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<body>
<style>
/* Layout: one narrow column (phone-first), sticky day tabs, a set log per exercise, fixed rest timer at the bottom. */
:root{
  --bg:#f3f2ef; --surface:#ffffff; --surface-2:#eceae5; --line:#dcd9d2;
  --fg:#1b1a18; --muted:#6f6b63; --accent:#e4570f; --accent-ink:#ffffff; --accent-soft:#fbe4d6;
  --cool:#2f6e9e; --cool-soft:#e1ecf5; --warm-soft:#f7ecd5; --warm:#b7791f; --ok:#2f8a4e; --ok-soft:#dff1e5;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1e1d1b; --surface-2:#2a2826; --line:#363431;
  --fg:#f1efea; --muted:#a29d94; --accent:#ff7a33; --accent-ink:#1a0e06; --accent-soft:#3a2214;
  --cool:#7db4e0; --cool-soft:#1b2a36; --warm-soft:#32291a; --warm:#e0ab52; --ok:#5ccc82; --ok-soft:#173222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1e1d1b; --surface-2:#2a2826; --line:#363431;
  --fg:#f1efea; --muted:#a29d94; --accent:#ff7a33; --accent-ink:#1a0e06; --accent-soft:#3a2214;
  --cool:#7db4e0; --cool-soft:#1b2a36; --warm-soft:#32291a; --warm:#e0ab52; --ok:#5ccc82; --ok-soft:#173222; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 140px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:13px;letter-spacing:.02em;text-transform:none;color:var(--muted);margin-top:4px}
.sync{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--warm)} .sync.local i{background:var(--accent)}

.weeks{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:1 0 auto;min-width:48px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;text-align:center}
.wk b{display:block;font-family:var(--display);font-size:20px;line-height:1}
.wk span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wk[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.wk[aria-pressed="true"] span{color:inherit;opacity:.7}
.wkhint{font-size:13px;color:var(--muted);margin:8px 2px 0}

nav.days{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:12px 10px;margin-top:6px;border-bottom:1px solid var(--line)}
.day{border:0;background:transparent;border-radius:10px;padding:6px 2px;text-align:center;position:relative}
.day b{display:block;font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] span{color:inherit;opacity:.85}
.day .dot{position:absolute;top:5px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--ok)}

.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
.dayhead h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
.dayhead .meta{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.tools{display:flex;gap:8px;justify-content:flex-end;margin-bottom:8px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600}
.ghost[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.block{margin-top:16px}
.bhead{display:flex;align-items:center;gap:8px;margin:0 2px 8px;flex-wrap:wrap}
.bhead h2{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin:0}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.k-warm .tag{background:var(--warm-soft);color:var(--warm)}
.k-main .tag,.k-bi .tag,.k-core .tag{background:var(--accent-soft);color:var(--accent)}
.k-cardio .tag{background:var(--cool-soft);color:var(--cool)}
.btip{font-size:13px;color:var(--muted);margin:-4px 2px 8px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.k-bi .group,.k-core .group{border-left:4px solid var(--accent)}
.k-cardio .group{border-left:4px solid var(--cool)}
.k-warm .group{border-left:4px solid var(--warm)}
.ex{padding:14px 14px 12px}
.ex+.ex{border-top:1px solid var(--line)}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exname{font-weight:700;font-size:17px;line-height:1.2;min-width:0}
.exnote{font-size:13px;color:var(--muted);margin-top:3px}
.mynote{font-size:13px;color:var(--fg);background:var(--surface-2);border-radius:8px;padding:6px 9px;margin-top:8px}
.restchip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.restchip svg{width:14px;height:14px}

.sets{display:grid;grid-template-columns:28px 1fr minmax(0,1.3fr) 44px;gap:6px 8px;align-items:center;margin-top:10px}
.sets .h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sn{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.rp{font-family:var(--display);font-weight:600;font-size:20px}
.rp small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
.kg{position:relative}
.kg input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font-family:var(--display);font-weight:700;font-size:21px;padding:0 34px 0 12px;-webkit-appearance:none;appearance:none}
.kg input::placeholder{color:var(--muted);opacity:.55;font-weight:600}
.kg em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--muted);pointer-events:none}
.chk{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.chk svg{width:22px;height:22px;opacity:0}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chk[aria-pressed="true"] svg{opacity:1}
.row-skip{opacity:.4}
.skipnote{grid-column:2 / -1;font-size:12px;color:var(--muted);margin-top:-4px}
.single{display:flex;align-items:center;gap:10px;margin-top:10px}
.single .tgt{flex:1;font-family:var(--display);font-weight:600;font-size:20px}
.single .tgt small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;display:block}
.single .kg{width:120px}
.prev{font-size:12px;color:var(--muted);margin-top:8px}
.prev b{color:var(--fg);font-weight:600}

.edit{display:grid;gap:8px;margin-top:10px;background:var(--surface-2);border-radius:10px;padding:10px}
.edit label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:grid;gap:4px}
.edit input,.edit textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;font-size:16px;padding:8px 10px;text-transform:none;letter-spacing:0}
.edit textarea{min-height:56px;resize:vertical}
.edit .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.edit .acts{display:flex;justify-content:space-between;gap:8px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0}

/* progress */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.pgrid{grid-template-columns:repeat(3,1fr)}}
.lift h3{font-size:14px;margin:0 0 2px;font-weight:700}
.lift .big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1}
.lift .big small{font-size:15px;color:var(--muted);font-weight:600;margin-left:2px}
.lift .delta{font-size:12px;font-weight:600}
.up{color:var(--ok)} .flat{color:var(--muted)}
.lift svg{display:block;width:100%;height:40px;margin-top:6px}
.tablewrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ptitle{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin:22px 2px 8px}
.rules li{margin-bottom:6px}
.rules{padding-left:18px;margin:0;font-size:14px}
.backup{display:flex;gap:8px;flex-wrap:wrap}
.backup .ghost{cursor:pointer;display:inline-block}
.danger{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.danger button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px}
.danger .yes{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* how-to */
.howbtn{margin-top:8px;border:0;background:none;padding:4px 0;color:var(--accent);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.howbtn svg{width:16px;height:16px;transition:transform .2s}
.howbtn[aria-expanded="true"] svg{transform:rotate(90deg)}
.how{display:grid;gap:12px;margin-top:8px;background:var(--surface-2);border-radius:12px;padding:12px}
@media (min-width:520px){.how{grid-template-columns:200px 1fr;align-items:start}}
.figs{display:flex;gap:8px;justify-content:center}
.fig{background:var(--surface);border-radius:10px;width:100%;max-width:220px;position:relative}
.fig svg{display:block;width:100%;height:auto}
.fig .cap{position:absolute;left:8px;top:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.how ol{margin:0;padding-left:20px;font-size:14px;display:grid;gap:5px}
.how .ojo{margin-top:8px;font-size:13px;background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:8px 10px}
.how .ojo b{color:var(--accent)}
.f-n{stroke:var(--fg);stroke-linecap:round;stroke-linejoin:round;fill:none}
.f-f{stroke:var(--muted);stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.75}
.f-head{fill:var(--fg)}
.f-body{fill:var(--fg);stroke:var(--fg);stroke-width:6;stroke-linejoin:round}
.f-floor{stroke:var(--line);stroke-width:2}
.f-fur{fill:var(--line);stroke:none}
.f-frame{stroke:var(--muted);stroke-linecap:round;fill:none;opacity:.6}
.f-cable{stroke:var(--cool);stroke-width:1.6;fill:none}
.f-pul{fill:var(--surface);stroke:var(--cool);stroke-width:2}
.f-eq{fill:var(--accent);stroke:var(--accent)}
.f-eqs{stroke:var(--accent);stroke-linecap:round;fill:none}
.f-eqring{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5}

/* timer */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--fg);color:var(--bg);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(110%);transition:transform .25s ease}
.timer.on{transform:none}
.timer .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.timer .t{font-family:var(--display);font-weight:800;font-size:42px;line-height:1;min-width:96px}
.timer .lbl{flex:1;min-width:0;font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);background:transparent;color:var(--bg);border-radius:10px;padding:8px 12px;font-weight:700}
.timer.done{background:var(--ok);color:#fff}
.timer.done button{color:#fff;border-color:#ffffff66}
.timer .prog{position:absolute;left:0;top:0;height:3px;background:var(--accent);transition:width 1s linear}
@media (prefers-reduced-motion:reduce){.timer,.bar i,.timer .prog{transition:none}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-140%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;z-index:30;transition:transform .2s}
.toast.on{transform:translate(-50%,0)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Rutina de Lucas<small>Megatlon Villa Crespo · 6 semanas · 4 días</small></div>
    <span class="sync" id="sync"><i></i><span>Cargando…</span></span>
  </header>
  <div class="weeks" id="weeks" role="group" aria-label="Semana"></div>
  <p class="wkhint" id="wkhint"></p>
  <nav class="days" id="days" aria-label="Día"></nav>
  <main id="main"></main>
</div>

<div class="timer" id="timer" role="timer" aria-live="polite">
  <div class="prog" id="tprog"></div>
  <div class="in">
    <div class="t num" id="tval">0:00</div>
    <div class="lbl" id="tlbl">Descanso</div>
    <button type="button" id="tplus">+15"</button>
    <button type="button" id="tstop">Listo</button>
  </div>
</div>
<div class="toast" id="toast"></div>

function animate(now) {

  els.forEach(el => {
    const f = FIG[el.dataset.fig], per = f.fast ? 900 : f.slow ? 4000 : 3000;
    const ph = (now % per) / per;
    let s;
    if (f.fast) s = 0.5 - 0.5 * Math.cos(ph * 2 * Math.PI);

function spark(vals) {

}

  LIFTS.forEach(([id, label]) => {
    const vals = [...Array(WEEKS)].map((_, i) => bestOf(i + 1, id));
    const got = vals.map((v, i) => [i, v]).filter(p => p[1] != null);
    const last = got.length ? got[got.length - 1] : null, first = got.length ? got[0] : null;
    const diff = last && first && last[0] !== first[0] ? last[1] - first[1] : null;
    h += `<div class="card lift"><h3>${esc(label)}</h3><div class="big num">${last ? fmtKg(last[1]) : "—"}<small>kg</small></div>
      <div class="delta num ${diff > 0 ? "up" : "flat"}">${diff == null ? (last ? "Semana " + (last[0] + 1) : "Sin datos todavía") : (diff > 0 ? "+" : "") + fmtKg(diff) + " kg desde sem. " + (first[0] + 1)}</div>${spark(vals)}</div>`;
  });
  h += `</div><h2 class="ptitle">Días completados</h2><div class="card tablewrap" style="margin-top:0"><table><thead><tr><th>Día</th>${[...Array(WEEKS)].map((_, i) => `<th>S${i + 1}</th>`).join("")}</tr></thead><tbody>`;
  ROUTINE.forEach((d, di) => {
    h += `<tr><td>${esc(d.name)}</td>${[...Array(WEEKS)].map((_, i) => { const p = dayProgress(di, i + 1); return `<td class="num">${p.done === 0 ? "—" : p.done === p.tot ? '<span class="up">✓</span>' : Math.round(100 * p.done / p.tot) + "%"}</td>`; }).join("")}</tr>`;
  });
  h += `</tbody></table></div>
  <h2 class="ptitle">Pautas</h2><div class="card"><ul class="rules">
    <li>No bajes los pesos en los básicos aunque estés en déficit: sostené o subí la carga.</li>
    <li>Dejá 1–2 reps en reserva en los ejercicios pesados. En máquinas y poleas podés ir más cerca del fallo.</li>
    <li>Si la fatiga aprieta, sacá una serie de cada accesorio antes de tocar los básicos.</li>
    <li>Cinta: el trote continuo sube 2 min por semana y los intervalos pasan de 6 a 8 rondas. Si molestan rodillas o canillas, caminata con 8–12 % de inclinación.</li>
    <li>Si el total pasa de 1 h 20, recortá la entrada en calor de piernas a 5 min.</li>
  </ul>
  <h2 class="ptitle" style="margin-top:18px">Copia de seguridad</h2><p style="font-size:14px;margin:0 2px 10px;color:var(--muted)">Tus pesos se guardan en este celular. Hacé una copia de vez en cuando y guardala en iCloud o mandatela por WhatsApp.</p><div class="backup"><button type="button" class="ghost" data-act="export">Guardar copia</button><label class="ghost" for="importfile">Cargar copia</label><input type="file" id="importfile" accept="application/json,.json" hidden></div><h2 class="ptitle" style="margin-top:18px">Actualizaciones</h2><p style="font-size:14px;margin:0 2px 10px;color:var(--muted)">La app nunca usa internet por su cuenta. Cuando te avise que hay cambios, tocá este botón <b>estando en Wi-Fi</b>. Versión instalada: <span class="num">2</span>.</p><div class="backup"><button type="button" class="ghost" data-act="update" id="updbtn">Buscar actualización</button></div><div class="danger" id="danger"><button type="button" data-act="askclear">Borrar los registros de la semana ${S.week}</button></div></div>`;
  return h;
}

function render() {
  renderWeeks();
  $t("main").innerHTML = S.day === 4 ? renderProgress() : renderDay();
  startFigs();
}

// ---------- backup ----------
async function exportData() {
  const data = JSON.stringify({ app: "rutina-lucas", v: 1, saved: new Date().toISOString(), logs: S.logs, lt: S.lt, custom: S.custom, ct: S.ct }, null, 1);
  const name = "rutina-copia-" + new Date().toISOString().slice(0, 10) + ".json";
  const file = new File([data], name, { type: "application/json" });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Copia de la rutina" }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
document.addEventListener("change", async ev => {
  if (ev.target.id !== "importfile" || !ev.target.files[0]) return;
  try {
    const p = JSON.parse(await ev.target.files[0].text());
    if (p.app !== "rutina-lucas" || !p.logs) throw new Error("bad");
    for (let w = 1; w <= WEEKS; w++) S.logs[w] = p.logs[w] || {};
    S.lt = p.lt || {}; S.custom = p.custom || {}; S.ct = p.ct || 0; persistLocal(); render(); toast("Copia cargada");
  } catch (e) { toast("Ese archivo no es una copia de la rutina"); }
  ev.target.value = "";
});

// ---------- manual update (only when the user taps) ----------
const APP_VERSION = "2";
async function checkUpdate(btn) {
  btn.disabled = true; btn.textContent = "Buscando…";
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const v = (await r.json()).version;
    if (String(v) === APP_VERSION) { toast("Ya tenés la última versión"); btn.disabled = false; btn.textContent = "Buscar actualización"; return; }
    const reg = await navigator.serviceWorker.ready;
    btn.textContent = "Descargando…";
    navigator.serviceWorker.addEventListener("message", ev => {
      if (ev.data && ev.data.type === "updated") { toast("Actualizada"); setTimeout(() => location.reload(), 600); }
      if (ev.data && ev.data.type === "update-failed") { toast("No se pudo actualizar. Probá de nuevo con Wi-Fi"); btn.disabled = false; btn.textContent = "Buscar actualización"; }
    }, { once: true });
    reg.active.postMessage({ type: "update" });
  } catch (e) { toast("Sin conexión. Probá cuando estés en Wi-Fi"); btn.disabled = false; btn.textContent = "Buscar actualización"; }
}

// ---------- events ----------
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.week) { S.week = +b.dataset.week; persistLocal(); render(); return; }
  if (b.dataset.day != null && b.classList.contains("day")) { S.day = +b.dataset.day; S.edit = false; persistLocal(); render(); window.scrollTo({ top: 0 }); return; }
  if (b.dataset.act === "export") { exportData(); return; }
  if (b.dataset.act === "update") { checkUpdate(b); return; }
  if (b.dataset.act === "edit") { S.edit = !S.edit; render(); return; }
  if (b.dataset.how) {
    const id = b.dataset.how, art = b.closest(".ex"), open = !OPEN.has(id);
    if (open) { OPEN.add(id); b.insertAdjacentHTML("afterend", howHTML(id)); startFigs(); }
    else { OPEN.delete(id); const p = art.querySelector(".how"); if (p) p.remove(); }
    b.setAttribute("aria-expanded", open); return;
  }
  if (b.dataset.rest) { startRest(+b.dataset.rest, b.dataset.name); return; }
  if (b.dataset.chk) {
    const id = b.dataset.chk, i = +b.dataset.i, en = entry(S.week, id); en.d = en.d || [];
    en.d[i] = !en.d[i]; b.setAttribute("aria-pressed", en.d[i]);
    saveWeek(S.week);
    const e = ex(id);
    if (en.d[i] && e.rest && (e.mode === "sets" || e.mode === "time")) startRest(e.rest, e.name);
    const p = dayProgress(S.day, S.week);
    const bar = document.querySelector(".bar i"); if (bar) bar.style.width = (p.tot ? 100 * p.done / p.tot : 0) + "%";
    const cnt = document.querySelector(".tools .num"); if (cnt) cnt.textContent = p.done + "/" + p.tot + " hechas";
    if (p.tot && p.done === p.tot) { toast("¡Día completo!"); renderWeeks(); } else renderWeeks();
    return;
  }
  if (b.dataset.reset) { delete S.custom[b.dataset.reset]; saveCustom(); render(); return; }
  if (b.dataset.act === "askclear") { $t("danger").innerHTML = `¿Borrar todo lo anotado en la semana ${S.week}? <button type="button" class="yes" data-act="clear">Sí, borrar</button><button type="button" data-act="noclear">Cancelar</button>`; return; }
  if (b.dataset.act === "noclear") { render(); return; }
  if (b.dataset.act === "clear") { S.logs[S.week] = {}; saveWeek(S.week); toast("Semana " + S.week + " borrada"); render(); return; }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.dataset.kg) { const en = entry(S.week, t.dataset.kg); en.w = en.w || []; en.w[+t.dataset.i] = t.value.trim(); saveWeek(S.week); return; }
  if (t.dataset.v) { const en = entry(S.week, t.dataset.v); en.v = t.value.trim(); saveWeek(S.week); return; }
  if (t.dataset.ed) {
    const id = t.dataset.id, c = Object.assign({}, S.custom[id] || {}), v = t.value;
    if (t.dataset.ed === "name") { if (v.trim()) c.name = v.trim(); else delete c.name; }
    if (t.dataset.ed === "note") { if (v.trim()) c.note = v; else delete c.note; }
    if (t.dataset.ed === "rest") { const n = parseInt(v, 10); if (!isNaN(n)) c.rest = n; else delete c.rest; }
    if (t.dataset.ed === "reps") {
      const s = v.trim(), m = s.match(/^(\d+)\s*[x×]\s*(.+)$/i);
      const arr = m ? Array(Math.min(10, +m[1])).fill(m[2].trim()) : s.split("/").map(x => x.trim()).filter(Boolean);
      if (arr.length) c.reps = arr; else delete c.reps;
    }
    if (Object.keys(c).length) S.custom[id] = c; else delete S.custom[id];
    saveCustom();
  }
});
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.matches("input[data-kg],input[data-v]")) ev.target.blur(); });

render();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js", { updateViaCache: "all" }).catch(() => {});
}
</script>

</body>
